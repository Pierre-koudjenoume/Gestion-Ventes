<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - JP CONSULTING SERVICES</title>
    <link rel="icon" type="image/png" href="Logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: #f8f6f3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-container {
            background: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .login-logo { width: 80px; height: 80px; object-fit: contain; margin-bottom: 20px; }
        .login-container h1 { font-size: 1.8rem; color: #1a1a1a; margin-bottom: 8px; }
        .login-container .subtitle { color: #6b6b6b; font-weight: 300; margin-bottom: 30px; }
        .login-container .error-msg {
            background: #f8d7da; color: #721c24;
            padding: 10px 15px; border-radius: 10px;
            margin-bottom: 20px; display: none; font-size: 0.9rem;
        }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; font-weight: 500; color: #1a1a1a; margin-bottom: 5px; font-size: 0.9rem; }
        .form-group input {
            width: 100%; padding: 12px 16px;
            border: 2px solid #e0e0e0; border-radius: 12px;
            font-size: 1rem; font-family: 'Poppins', sans-serif;
            transition: border-color 0.3s; outline: none;
        }
        .form-group input:focus { border-color: #f57411; }
        .btn-login {
            width: 100%; padding: 14px;
            background: #f57411; color: #ffffff;
            border: none; border-radius: 30px;
            font-size: 1rem; font-weight: 600; cursor: pointer;
            transition: all 0.3s ease; font-family: 'Poppins', sans-serif;
        }
        .btn-login:hover { background: #b75607; transform: translateY(-2px); box-shadow: 0 8px 25px rgba(245,116,17,0.3); }
        .btn-login:active { transform: scale(0.95); }
        .login-footer { margin-top: 20px; color: #6b6b6b; font-size: 0.8rem; }
        @media (max-width: 480px) { .login-container { padding: 30px 20px; margin: 20px; } }
    </style>
</head>
<body>
    <div class="login-container">
        <img src="Logo.png" alt="JP Consulting Services" class="login-logo">
        <h1>Connexion</h1>
        <p class="subtitle">Gestion des Ventes - JP CONSULTING SERVICES</p>
        <div id="error-msg" class="error-msg">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span id="error-text">Identifiants incorrects</span>
        </div>
        <form id="login-form">
            <div class="form-group">
                <label for="username">Identifiant</label>
                <input type="text" id="username" placeholder="Entrez votre identifiant" required>
            </div>
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" placeholder="Entrez votre mot de passe" required>
            </div>
            <button type="submit" class="btn-login"><i class="fa-solid fa-right-to-bracket"></i> Se connecter</button>
        </form>
        <div class="login-footer"><p>Contactez l'administrateur si vous n'avez pas d'accès.</p></div>
    </div>
    <script>
        const users = [
            { id: 1, username: 'admin', password: 'admin123', role: 'admin', name: 'Jean-Pierre KOUDJENOUME' },
            { id: 2, username: 'employe', password: 'employe123', role: 'employee', name: 'Employé' }
        ];
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('error-msg');
            const errorText = document.getElementById('error-text');
            const user = users.find(u => u.username === username && u.password === password);
            if (user) {
                sessionStorage.setItem('user', JSON.stringify(user));
                window.location.href = 'index.html';
            } else {
                errorText.textContent = 'Identifiant ou mot de passe incorrect.';
                errorMsg.style.display = 'block';
            }
        });
        if (sessionStorage.getItem('user')) window.location.href = 'index.html';
    </script>
</body>
</html>
