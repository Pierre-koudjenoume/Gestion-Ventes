<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JP CONSULTING SERVICES - Ajouter une transaction</title>
    <link rel="icon" type="image/png" href="../Logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../Styles/style.css">
    <link rel="stylesheet" href="../Styles/add.css">
</head>
<body>

    <header>
        <div class="logo-title-wrapper">
            <img src="../Logo.png" alt="JP Consulting Services" class="header-logo">
            <div>
                <h1 class="hero-title">Gestion des Ventes</h1>
                <p class="hero-subtitle">Gérez facilement vos entrées et sorties</p>
            </div>
        </div>
        
        <nav>
            <a href="index.html"><i class="fa-solid fa-gauge-high"></i> Tableau de bord</a>
            <a href="transactions.html"><i class="fa-solid fa-list"></i> Transactions</a>
            <a href="add.html" class="active"><i class="fa-solid fa-plus"></i> Ajouter</a>
            <a href="stock.html"><i class="fa-solid fa-boxes-stacked"></i> Stock</a>
            <a href="stats.html"><i class="fa-solid fa-chart-simple"></i> Statistiques</a>
        </nav>
    </header>

    <main>
        <section class="section active">
            <div class="form-container">
                <h2>📝 Ajouter une transaction</h2>
                
                <div id="success-message" style="display:none;"></i>
                    <span style="font-weight: 600; margin-left: 10px;">Transaction ajoutée avec succès !</span>
                </div>

                <form id="transaction-form">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="produit">Nom du produit *</label>
                            <input type="text" id="produit" placeholder="Ex: Lenovo ThinkPad" required>
                        </div>
                        <div class="form-group">
                            <label for="categorie">Catégorie</label>
                            <input type="text" id="categorie" placeholder="Ex: Ordinateur portable">
                        </div>
                        <div class="form-group">
                            <label for="prix">Prix unitaire (FCFA) *</label>
                            <input type="number" id="prix" placeholder="50000" step="1" required>
                        </div>
                        <div class="form-group">
                            <label for="quantite">Quantité *</label>
                            <input type="number" id="quantite" placeholder="1" min="1" required>
                        </div>
                        <div class="form-group">
                            <label for="type">Type de transaction *</label>
                            <select id="type" required>
                                <option value="entree">📥 Entrée (achat)</option>
                                <option value="sortie">📤 Sortie (vente)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="client">Client / Fournisseur</label>
                            <input type="text" id="client" placeholder="Nom du client ou fournisseur">
                        </div>
                    </div>
                    <button type="submit" class="btn-primary" id="submit-btn">
                        <i class="fa-solid fa-plus"></i> Ajouter la transaction
                    </button>
                </form>
            </div>
        </section>
    </main>

    <footer>
    <div class="footer-content">
        <div class="footer-top">
            <p class="footer-brand">JP CONSULTING SERVICES</p>
            <div class="footer-divider"></div>
        </div>
        <div class="footer-bottom">
            <p class="footer-dev">Développé par Jean-Pierre KOUDJENOUME</p>
        </div>
    </div>
    </footer>

    <script src="../Scripts/data.js"></script>
    <script src="../Scripts/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            loadData();
            
            const form = document.getElementById('transaction-form');
            const successMsg = document.getElementById('success-message');
            
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const produit = document.getElementById('produit').value.trim();
                const categorie = document.getElementById('categorie').value.trim();
                const prix = parseFloat(document.getElementById('prix').value);
                const quantite = parseInt(document.getElementById('quantite').value);
                const type = document.getElementById('type').value;
                const client = document.getElementById('client').value.trim();
                
                if (!produit) {
                    alert('Veuillez saisir un nom de produit.');
                    document.getElementById('produit').focus();
                    return;
                }
                
                if (isNaN(prix) || prix <= 0) {
                    alert('Veuillez saisir un prix valide.');
                    document.getElementById('prix').focus();
                    return;
                }
                
                if (isNaN(quantite) || quantite <= 0) {
                    alert('Veuillez saisir une quantité valide.');
                    document.getElementById('quantite').focus();
                    return;
                }
                
                const transaction = {
                    id: Date.now(),
                    produit: produit,
                    categorie: categorie || 'Non catégorisé',
                    prix: prix,
                    quantite: quantite,
                    type: type,
                    client: client || 'Inconnu',
                    date: new Date().toLocaleDateString('fr-FR'),
                    timestamp: Date.now()
                };
                
                transactions.unshift(transaction);
                saveData();
                
                successMsg.style.display = 'block';
                setTimeout(function() {
                    successMsg.style.display = 'none';
                }, 3000);
                
                form.reset();
                refreshUI();
                
                console.log('✅ Transaction ajoutée :', transaction);
                console.log('📊 Total transactions :', transactions.length);
            });
        });
    </script>

</body>
</html>
