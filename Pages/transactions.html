<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JP CONSULTING SERVICES - Transactions</title>
    <link rel="icon" type="image/png" href="../Logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../Styles/style.css">
    <link rel="stylesheet" href="../Styles/transactions.css">
</head>
<body>

    <header>
        <div class="logo-title-wrapper">
            <img src="../Logo.png" alt="JP Consulting Services" class="header-logo">
            <div>
                <h1 class="hero-title">Gestion des Ventes</h1>
                <p class="hero-subtitle">Gérez facilement vos entrées et sorties</p>
            </div>
        </div>
        
        <nav>
            <a href="index.html"><i class="fa-solid fa-gauge-high"></i> Tableau de bord</a>
            <a href="transactions.html" class="active"><i class="fa-solid fa-list"></i> Transactions</a>
            <a href="add.html"><i class="fa-solid fa-plus"></i> Ajouter</a>
            <a href="stock.html"><i class="fa-solid fa-boxes-stacked"></i> Stock</a>
            <a href="stats.html"><i class="fa-solid fa-chart-simple"></i> Statistiques</a>
        </nav>
    </header>

    <main>
        <section class="section active">
            <div class="section-header">
                <h2>📋 Toutes les transactions</h2>
                <div class="controls-wrapper">
                    <div class="search-container">
                        <i class="fa-solid fa-search search-icon"></i>
                        <input type="text" id="search-input" placeholder="Rechercher un produit...">
                    </div>
                    <select id="filter-type">
                        <option value="all">📊 Tous</option>
                        <option value="entree">📥 Entrées</option>
                        <option value="sortie">📤 Sorties</option>
                    </select>
                </div>
            </div>
            <div id="transaction-list" class="transaction-list"></div>
        </section>
    </main>

    <footer>
    <div class="footer-content">
        <div class="footer-top">
            <p class="footer-brand">JP CONSULTING SERVICES</p>
            <div class="footer-divider"></div>
        </div>
        <div class="footer-bottom">
            <p class="footer-dev">Développé par Jean-Pierre KOUDJENOUME</p>
        </div>
    </div>
    </footer>

    <script src="../Scripts/data.js"></script>
    <script src="../Scripts/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            loadData();
            applyFilters();
            
            document.getElementById('search-input').addEventListener('input', applyFilters);
            document.getElementById('filter-type').addEventListener('change', applyFilters);
        });
    </script>

</body>
</html>
